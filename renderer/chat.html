<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div class="chat">
    <!-- 标题栏（可拖动窗口）-->
    <div class="chat__bar">
      <span class="chat__name">和蛋蛋聊天 <i id="conn" class="conn no">连接中…</i></span>
      <button id="closeBtn" class="chat__close" title="关闭">✕</button>
    </div>

    <!-- 工具条：权限模式 / 清空 / 干活状态 / 中断 -->
    <div class="chat__tools">
      <select id="modeSelect" class="tools__mode-select" title="蛋蛋干活的模式（对应 opencode）">
        <option value="build">构建模式（可改文件）</option>
        <option value="plan">计划模式（只读）</option>
      </select>
      <button id="clearBtn" class="tools__clear" title="清空当前对话记录">🧹 清空对话</button>
      <span id="runState" class="tools__run" hidden>🔧 蛋蛋干活中…</span>
      <button id="stopBtn" class="tools__stop" hidden>⛔ 中断</button>
    </div>

    <div id="log" class="chat__log" aria-live="polite"></div>

    <div class="chat__inputbar">
      <div class="chat__inputwrap">
        <textarea id="input" class="chat__input" placeholder="和蛋蛋说点什么…"></textarea>
      </div>
      <button id="sendBtn" class="chat__send">发送</button>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>
